<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 730" width="1040" height="730" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', sans-serif">
  <style>
    :root { color-scheme: light dark; }
    .bg     { fill: #ffffff; }
    .title  { fill: #1a1a1a; font-size: 19px; font-weight: 600; }
    .col    { fill: #1a1a1a; font-size: 15px; font-weight: 600; }
    .row    { fill: #555c66; font-size: 14px; font-weight: 600; }
    .cap    { fill: #555c66; font-size: 12.5px; }
    .note   { fill: #7a828c; font-size: 11.5px; }
    .body   { fill: #f2f4f7; stroke: #3d434d; stroke-width: 2; }
    .bar    { fill: #3b7dd8; }
    .fold   { stroke: #d9534f; stroke-width: 2.5; stroke-dasharray: 7 5; }
    .cell   { fill: none; stroke: #e2e5ea; stroke-width: 1; }
    @media (prefers-color-scheme: dark) {
      .bg    { fill: #0d1117; }
      .title { fill: #e6edf3; }
      .col   { fill: #e6edf3; }
      .row   { fill: #aeb7c2; }
      .cap   { fill: #aeb7c2; }
      .note  { fill: #8b949e; }
      .body  { fill: #1b2230; stroke: #b0b8c4; }
      .bar   { fill: #6ea8fe; }
      .fold  { stroke: #ff7b72; }
      .cell  { stroke: #262d38; }
    }
  </style>

  <rect class="bg" x="0" y="0" width="1040" height="730"/>
  <text class="title" x="30" y="36">iPhone Duo の 6 つのポーズ</text>
  <text class="note" x="30" y="58">3 つの状態（閉じる / 完全に開く / 部分的に折る）× 2 つの向き</text>

  <!-- 列見出し -->
  <text class="col" x="265" y="98" text-anchor="middle">closed</text>
  <text class="note" x="265" y="116" text-anchor="middle">外側ディスプレイ / compact</text>
  <text class="col" x="575" y="98" text-anchor="middle">fully open</text>
  <text class="note" x="575" y="116" text-anchor="middle">内側ディスプレイ / regular</text>
  <text class="col" x="885" y="98" text-anchor="middle">partially folded</text>
  <text class="note" x="885" y="116" text-anchor="middle">内側ディスプレイ + 折り目</text>

  <!-- 行見出し -->
  <text class="row" x="30" y="255">portrait</text>
  <text class="row" x="30" y="525">landscape</text>

  <!-- セル枠 -->
  <rect class="cell" x="120" y="132" width="290" height="250" rx="6"/>
  <rect class="cell" x="430" y="132" width="290" height="250" rx="6"/>
  <rect class="cell" x="740" y="132" width="290" height="250" rx="6"/>
  <rect class="cell" x="120" y="402" width="290" height="250" rx="6"/>
  <rect class="cell" x="430" y="402" width="290" height="250" rx="6"/>
  <rect class="cell" x="740" y="402" width="290" height="250" rx="6"/>

  <!-- 1. closed / portrait : 縦長・細い。バーは右辺に垂直 -->
  <g transform="translate(265,245)">
    <rect class="body" x="-52" y="-100" width="104" height="200" rx="11"/>
    <rect class="bar" x="30" y="-90" width="14" height="30" rx="4"/>
    <rect class="bar" x="30" y="-20" width="14" height="40" rx="4"/>
    <rect class="bar" x="30" y="52" width="14" height="38" rx="4"/>
  </g>
  <text class="cap" x="265" y="368" text-anchor="middle">バーが右辺に垂直配置</text>

  <!-- 2. fully open / portrait : 幅広の縦長。バーは上下に水平 -->
  <g transform="translate(575,245)">
    <rect class="body" x="-86" y="-100" width="172" height="200" rx="11"/>
    <rect class="bar" x="-76" y="-90" width="152" height="14" rx="4"/>
    <rect class="bar" x="-76" y="76" width="152" height="14" rx="4"/>
  </g>
  <text class="cap" x="575" y="368" text-anchor="middle">水平バーのまま（例外）</text>

  <!-- 3. partially folded / portrait : 折り目は水平。バーは上下に水平 -->
  <g transform="translate(885,245)">
    <rect class="body" x="-86" y="-100" width="172" height="200" rx="11"/>
    <rect class="bar" x="-76" y="-90" width="152" height="14" rx="4"/>
    <rect class="bar" x="-76" y="76" width="152" height="14" rx="4"/>
    <line class="fold" x1="-86" y1="0" x2="86" y2="0"/>
  </g>
  <text class="cap" x="885" y="368" text-anchor="middle">折り目が上下に分ける</text>

  <!-- 4. closed / landscape : 横長。バーは右辺に垂直 -->
  <g transform="translate(265,515)">
    <rect class="body" x="-100" y="-52" width="200" height="104" rx="11"/>
    <rect class="bar" x="76" y="-42" width="14" height="24" rx="4"/>
    <rect class="bar" x="76" y="-8" width="14" height="16" rx="4"/>
    <rect class="bar" x="76" y="18" width="14" height="24" rx="4"/>
  </g>
  <text class="cap" x="265" y="638" text-anchor="middle">縦がさらに短い</text>

  <!-- 5. fully open / landscape : 横長。バーは側面に垂直 -->
  <g transform="translate(575,515)">
    <rect class="body" x="-100" y="-86" width="200" height="172" rx="11"/>
    <rect class="bar" x="76" y="-76" width="14" height="40" rx="4"/>
    <rect class="bar" x="76" y="-18" width="14" height="36" rx="4"/>
    <rect class="bar" x="76" y="36" width="14" height="40" rx="4"/>
  </g>
  <text class="cap" x="575" y="638" text-anchor="middle">バーが側面へ移動</text>

  <!-- 6. partially folded / landscape : 折り目は垂直。バーは側面 -->
  <g transform="translate(885,515)">
    <rect class="body" x="-100" y="-86" width="200" height="172" rx="11"/>
    <rect class="bar" x="76" y="-76" width="14" height="40" rx="4"/>
    <rect class="bar" x="76" y="-18" width="14" height="36" rx="4"/>
    <rect class="bar" x="76" y="36" width="14" height="40" rx="4"/>
    <line class="fold" x1="0" y1="-86" x2="0" y2="86"/>
  </g>
  <text class="cap" x="885" y="638" text-anchor="middle">折り目が左右に分ける</text>

  <!-- 凡例 -->
  <g transform="translate(120,676)">
    <rect class="bar" x="0" y="-9" width="26" height="11" rx="3"/>
    <text class="note" x="34" y="1">システムのバー</text>
    <line class="fold" x1="150" y1="-4" x2="182" y2="-4"/>
    <text class="note" x="190" y="1">折り目（ヒンジ）</text>
    <text class="note" x="0" y="26">図では垂直バーを右辺に描いていますが、バーは常に前面カメラのある側に付きます。閉じた状態で回転させると左側に来ることもあります。</text>
  </g>
</svg>
