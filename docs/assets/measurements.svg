<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 470" width="1040" height="470" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', sans-serif">
  <style>
    :root { color-scheme: light dark; }
    .bg     { fill: #ffffff; }
    .title  { fill: #1a1a1a; font-size: 19px; font-weight: 600; }
    .head   { fill: #1a1a1a; font-size: 13.5px; font-weight: 600; }
    .note   { fill: #7a828c; font-size: 11.5px; }
    .num    { fill: #2a5fa8; font-size: 12px; font-weight: 600; font-family: ui-monospace, Menlo, monospace; }
    .num2   { fill: #4aa96c; font-size: 12px; font-weight: 600; font-family: ui-monospace, Menlo, monospace; }
    .body   { fill: #f2f4f7; stroke: #3d434d; stroke-width: 2; }
    .bar    { fill: #3b7dd8; fill-opacity: 0.85; }
    .margin { fill: #4aa96c; fill-opacity: 0.4; }
    .tick   { stroke: #2a5fa8; stroke-width: 1.2; }
    .tick2  { stroke: #4aa96c; stroke-width: 1.2; }
    @media (prefers-color-scheme: dark) {
      .bg     { fill: #0d1117; }
      .title  { fill: #e6edf3; }
      .head   { fill: #e6edf3; }
      .note   { fill: #8b949e; }
      .num    { fill: #9ec5ff; }
      .num2   { fill: #6fd398; }
      .body   { fill: #1b2230; stroke: #b0b8c4; }
      .bar    { fill: #6ea8fe; }
      .margin { fill: #6fd398; }
      .tick   { stroke: #9ec5ff; }
      .tick2  { stroke: #6fd398; }
    }
  </style>

  <rect class="bg" x="0" y="0" width="1040" height="470"/>
  <text class="title" x="30" y="36">実測した垂直バーの構造（iPhone Duo シミュレータ / iOS 27.1）</text>
  <text class="note" x="30" y="58">青 = safe area inset（バーの側）、緑 = content margin（逆側）。バーは物理的に同じ辺に留まるため、回転すると leading / trailing が入れ替わります。</text>

  <!-- 1. closed / portrait -->
  <text class="head" x="70" y="98">closed / portrait</text>
  <text class="note" x="70" y="116">466 × 678 pt · compact / regular</text>
  <g transform="translate(70,130)">
    <rect class="body" x="0" y="0" width="150" height="218" rx="10"/>
    <rect class="bar" x="126" y="6" width="18" height="206" rx="5"/>
    <rect class="margin" x="6" y="6" width="6" height="206" rx="2"/>
    <line class="tick" x1="126" y1="232" x2="150" y2="232"/>
    <text class="num" x="138" y="250" text-anchor="middle">84.0</text>
    <line class="tick2" x1="0" y1="232" x2="12" y2="232"/>
    <text class="num2" x="6" y="250" text-anchor="middle">20.0</text>
    <text class="note" x="75" y="115" text-anchor="middle">trailing</text>
  </g>
  <text class="note" x="70" y="410">safe area trailing 84.0</text>
  <text class="note" x="70" y="428">content margin leading 20.0</text>

  <!-- 2. closed / landscape -->
  <text class="head" x="330" y="98">closed / landscape（右回転）</text>
  <text class="note" x="330" y="116">678 × 466 pt · compact / compact</text>
  <g transform="translate(330,168)">
    <rect class="body" x="0" y="0" width="240" height="150" rx="10"/>
    <rect class="bar" x="6" y="6" width="18" height="138" rx="5"/>
    <rect class="margin" x="228" y="6" width="6" height="138" rx="2"/>
    <line class="tick" x1="6" y1="164" x2="24" y2="164"/>
    <text class="num" x="15" y="182" text-anchor="middle">84.0</text>
    <line class="tick2" x1="228" y1="164" x2="234" y2="164"/>
    <text class="num2" x="231" y="182" text-anchor="middle">20.0</text>
    <text class="note" x="126" y="80" text-anchor="middle">leading</text>
  </g>
  <text class="note" x="330" y="410">バーが反対側に出る唯一のポーズ。</text>
  <text class="note" x="330" y="428">vertical size class が compact になるのもここだけ。</text>

  <!-- 3. fully open / portrait -->
  <text class="head" x="660" y="98">内側ディスプレイ / portrait</text>
  <text class="note" x="660" y="116">669 × 951 pt · regular / regular</text>
  <g transform="translate(660,130)">
    <rect class="body" x="0" y="0" width="160" height="218" rx="10"/>
    <rect class="margin" x="6" y="6" width="6" height="206" rx="2"/>
    <rect class="margin" x="148" y="6" width="6" height="206" rx="2"/>
    <line class="tick2" x1="0" y1="232" x2="12" y2="232"/>
    <text class="num2" x="6" y="250" text-anchor="middle">20.0</text>
    <line class="tick2" x1="148" y1="232" x2="160" y2="232"/>
    <text class="num2" x="154" y="250" text-anchor="middle">20.0</text>
    <text class="note" x="80" y="115" text-anchor="middle">垂直バーなし</text>
  </g>
  <text class="note" x="660" y="410">toolbarVerticalEdge は nil、safe area の左右は 0 / 0。</text>
  <text class="note" x="660" y="428">fully open と partially folded の両方でこうなります。</text>

  <text class="note" x="30" y="458">左右の safe area を足しても同じ値にならないため、片側のインセットを反対側に流用してはいけません。</text>
</svg>
