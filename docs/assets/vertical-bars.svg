<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 540" width="1040" height="540" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', sans-serif">
  <style>
    :root { color-scheme: light dark; }
    .bg     { fill: #ffffff; }
    .title  { fill: #1a1a1a; font-size: 19px; font-weight: 600; }
    .head   { fill: #1a1a1a; font-size: 14px; font-weight: 600; }
    .lbl    { fill: #555c66; font-size: 12px; }
    .note   { fill: #7a828c; font-size: 11.5px; }
    .body   { fill: #f2f4f7; stroke: #3d434d; stroke-width: 2; }
    .zone1  { fill: #8e7cc3; }
    .zone2  { fill: #3b7dd8; }
    .zone3  { fill: #4aa96c; }
    .stay   { fill: #e8a33d; }
    .arrow  { stroke: #7a828c; stroke-width: 1.6; fill: none; marker-end: url(#ah); }
    .ahf    { fill: #7a828c; }
    @media (prefers-color-scheme: dark) {
      .bg    { fill: #0d1117; }
      .title { fill: #e6edf3; }
      .head  { fill: #e6edf3; }
      .lbl   { fill: #aeb7c2; }
      .note  { fill: #8b949e; }
      .body  { fill: #1b2230; stroke: #b0b8c4; }
      .zone1 { fill: #b3a2e8; }
      .zone2 { fill: #6ea8fe; }
      .zone3 { fill: #6fd398; }
      .stay  { fill: #f0bc6a; }
      .arrow { stroke: #8b949e; }
      .ahf   { fill: #8b949e; }
    }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="ahf" d="M 0 0 L 10 5 L 0 10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1040" height="540"/>
  <text class="title" x="30" y="36">バーが側面へ移るとき、何がどこへ行くか</text>

  <!-- 左: 従来の水平バー -->
  <text class="head" x="60" y="78">従来（水平バー）</text>
  <text class="note" x="60" y="98">内側ディスプレイの portrait でも同じ</text>
  <g transform="translate(60,116)">
    <rect class="body" x="0" y="0" width="200" height="330" rx="12"/>
    <rect class="zone1" x="10" y="10" width="180" height="20" rx="4"/>
    <text class="lbl" x="100" y="25" text-anchor="middle" fill="#ffffff" font-size="10.5">ステータス</text>
    <rect class="zone2" x="10" y="36" width="180" height="26" rx="4"/>
    <text class="lbl" x="100" y="54" text-anchor="middle" fill="#ffffff" font-size="10.5">ナビゲーション</text>
    <rect class="zone3" x="10" y="288" width="180" height="32" rx="4"/>
    <text class="lbl" x="100" y="308" text-anchor="middle" fill="#ffffff" font-size="10.5">ツールバー / タブ</text>
    <text class="note" x="100" y="180" text-anchor="middle">コンテンツ</text>
  </g>

  <!-- 矢印 -->
  <path class="arrow" d="M 285 280 L 355 280"/>
  <text class="note" x="320" y="268" text-anchor="middle">縦が短いとき</text>

  <!-- 中央: 垂直バー -->
  <text class="head" x="380" y="78">垂直バー（側面へ集約）</text>
  <text class="note" x="380" y="98">閉じた状態 / 内側ディスプレイの landscape</text>
  <g transform="translate(380,116)">
    <rect class="body" x="0" y="0" width="260" height="330" rx="12"/>
    <rect class="zone1" x="222" y="10" width="28" height="70" rx="5"/>
    <rect class="zone2" x="222" y="126" width="28" height="78" rx="5"/>
    <rect class="zone3" x="222" y="250" width="28" height="70" rx="5"/>
    <text class="note" x="110" y="175" text-anchor="middle">コンテンツに縦を明け渡す</text>

    <text class="lbl" x="214" y="50" text-anchor="end">上 — ステータス / Live Activity</text>
    <text class="lbl" x="214" y="170" text-anchor="end">中 — アプリのコントロール</text>
    <text class="lbl" x="214" y="292" text-anchor="end">下 — ツールバー / タブ</text>
  </g>

  <!-- 右: 移動ルール -->
  <text class="head" x="700" y="78">垂直バーへ移るもの / 残るもの</text>
  <g transform="translate(700,100)">
    <rect class="zone2" x="0" y="8" width="22" height="22" rx="5"/>
    <text class="lbl" x="34" y="24">シンボルのみの項目 → 垂直バーへ移動</text>

    <rect class="stay" x="0" y="52" width="70" height="22" rx="5"/>
    <text class="lbl" x="82" y="68">テキストのボタン → 水平に残る</text>

    <rect class="stay" x="0" y="96" width="100" height="22" rx="5"/>
    <text class="lbl" x="112" y="112">セグメンテッド → 水平に残る</text>

    <text class="note" x="0" y="158">幅を必要とする要素は側面に入らないため、</text>
    <text class="note" x="0" y="176">横位置に留まります。</text>

    <text class="note" x="0" y="216">スペースが足りない場合は</text>
    <text class="note" x="0" y="234">オーバーフローメニューへ畳まれます。</text>

    <text class="lbl" x="0" y="278" font-weight="600">制御に使える API</text>
    <text class="note" x="0" y="300">toolbarVerticalBehavior — ビュー全体</text>
    <text class="note" x="0" y="318">axisBehavior — 項目ごと</text>
    <text class="note" x="0" y="336">toolbarVerticalCompressionBehavior — 優先順位</text>
    <text class="note" x="0" y="354">toolbarVerticalEdge — 現在どちら側かを読む</text>
  </g>

  <text class="note" x="30" y="510">標準コンポーネント（NavigationStack / TabView）を使っている場合のみ、この適応が自動で行われます。</text>
</svg>
